<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="ARCHIVIO STORICO - SERGIO SILVESTRINI">
    <meta property="og:description" content="Guarda i ricordi e i documenti dell'Archivio Scarabelli">
    <meta property="og:image" content="https://scarabelli-portale.github.io/scarabelliamente/immagini/scuola.jpg">
    <meta property="og:type" content="website">
    <title>ARCHIVIO STORICO - SERGIO SILVESTRINI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');
        
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0;
            background-color: #ffffff; /* Fondale bianco pagina principale */
            color: #000000; /* Testo generale nero */
            text-align: center;
            line-height: 1.6;
        }
        
        /* TESTATA ORIGINALE DI SERGIO MANTENUTA INTEGRALMENTE */
        .copertina-container { 
            position: relative; 
            width: 100%; 
            height: 280px; 
            overflow: hidden; 
            border-bottom: 5px solid #143ca0; 
            background: #000; 
        }
        
        .foto-scuola { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            opacity: 0.8; 
        }
        
        #contenitore-titolo { 
            position: absolute; 
            bottom: 15px; 
            left: 50%; 
            transform: translateX(-50%); 
            text-align: center; 
            z-index: 10; 
            width: 100%; 
        }
        
        .titolo-stampato { 
            font-size: 0.85rem; 
            letter-spacing: 5px; 
            text-transform: uppercase; 
            color: white; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9); 
            font-weight: bold; 
        }
        
        .firma-sergio { 
            font-family: 'Dancing Script', cursive; 
            font-size: 2.3rem; 
            color: white; 
            text-shadow: 2px 2px 6px rgba(0,0,0,1); 
        }
        
        .btn-nav { 
            position: absolute; 
            top: 15px; 
            padding: 8px 18px; 
            border-radius: 5px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 0.75rem; 
            z-index: 20; 
            border: none; 
            cursor: pointer; 
        }
        
        .btn-home { 
            left: 15px; 
            background: rgba(0,0,0,0.6); 
            color: white; 
        }
        
        .main-wrapper { 
            max-width: 1300px; 
            margin: 30px auto; 
            padding: 0 15px; 
        }
        
        .griglia-multimedia { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 30px; 
        }
        
        /* SCHEDINE DEI POST MODERNE SENZA CORNICI */
        .elemento-album { 
            background: #ffffff; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); 
            border: 1px solid #eaeaea; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            min-height: 250px; 
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .elemento-album:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .media-box { 
            width: 100%; 
            height: 160px; 
            background: #f9f9f9; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }
        
        .media-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .info-box { 
            padding: 16px; 
            flex-grow: 1; 
            text-align: center; 
        }
        
        .titolo-post { 
            font-size: 0.95rem; 
            font-weight: bold; 
            color: #143ca0; 
            text-transform: uppercase; 
        }
        
        /* OVERLAY PROFESSIONALE: FONDALE BIANCO A SCHERMO INTERO */
        #overlay-blu { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #ffffff; /* Sfondo bianco all'apertura del post */
            z-index: 9999; 
            color: #000000; 
            padding: 40px 25px; 
            box-sizing: border-box; 
            overflow-y: auto; 
        }
        
        #box-contenuto { 
            max-width: 850px; 
            margin: auto; 
            text-align: center; 
        }
        
        /* DETTAGLIO FOTO/VIDEO PULITO SENZA BORDI DORATI */
        .img-display-pulita {
            max-width: 100%; 
            max-height: 450px; 
            border-radius: 8px; 
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: inline-block;
        }
        
        /* TESTO STORIA IN NERO SU BIANCO SENZA BOX COLORE */
        .testo-storia { 
            text-align: justify; 
            font-size: 1.15rem; 
            line-height: 1.7; 
            margin: 25px auto; 
            padding: 10px; 
            color: #000000; /* Testo nero nitido */
            white-space: pre-wrap; 
            max-width: 750px;
        }

        /* AREA PULSANTI TESTUALI IN LINEA IN BASSO IN NERO */
        .piede-pulsantiera {
            margin-top: 50px;
            padding-bottom: 20px;
            text-align: center;
            border-top: 1px solid #eaeaea;
            padding-top: 30px;
            width: 100%;
        }

        .riga-testo-pulsanti {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        /* CORREZIONE CHIRURGICA: FORZA IL NERO E TOGLIE IL BLU E LE LINEE SOTTO */
        .puro-testo-btn {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
            margin: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none !important; /* Via le sottolineature blu del browser */
            color: #000000 !important; /* TUTTI i link rigorosamente neri */
            cursor: pointer;
            display: inline-block;
            font-family: sans-serif;
            letter-spacing: 0.8px;
            transition: color 0.2s ease;
        }

        .puro-testo-btn:hover {
            color: #143ca0 !important; /* Diventa blu portale solo quando ci passi sopra */
        }
    </style>
</head>
<body>

    <!-- COPERTINA IN ALTO -->
    <div class="copertina-container">
        <a href="index.html" class="btn-nav btn-home">⬅ HOME</a>
        <img src="immagini/scuola.jpg" class="foto-scuola">
        <div id="contenitore-titolo">
            <div class="titolo-stampato">Archivio Storico & Iconografico</div>
            <div class="firma-sergio">Sergio Silvestrini</div>
        </div>
    </div>

    <!-- GRIGLIA ALBUM -->
    <div class="main-wrapper">
        <div class="griglia-multimedia" id="lista-multimedia"></div>
    </div>

    <!-- OVERLAY MINIMALISTA BIANCO -->
    <div id="overlay-blu">
        <div id="box-contenuto">
            <!-- TITOLO DEL POST IN NERO INTENSO -->
            <div id="titolo-view" style="text-align: center; font-size: 2rem; color: #000000; font-weight: bold; margin-bottom: 25px; text-transform: uppercase; font-family: sans-serif; letter-spacing: 1px; line-height: 1.3;"></div>
            
            <!-- CONTENITORE IMMAGINE O VIDEO -->
            <div id="media-display"></div> 
            
            <!-- TESTO IN NERO -->
            <div id="testo-view" class="testo-storia"></div>
            
            <!-- PULSANTI SOLO TESTO FISSI NEL PIEDE CORRETTI -->
            <div class="piede-pulsantiera">
                <div class="riga-testo-pulsanti">
                    <a id="link-luoghi" href="#" target="_blank" class="puro-testo-btn">WZ LUOGHI SCARABELLI</a>
                    <a id="link-consiglio" href="#" target="_blank" class="puro-testo-btn">WZ CONSIGLIO</a>
                    <a id="link-privato" href="#" target="_blank" class="puro-testo-btn">WZ A ME PRIVATO</a>
                    <button class="puro-testo-btn" onclick="chiudiTutto()">CHIUDI X</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = { databaseURL: "https://sito-sergio-b19ce-default-rtdb.europe-west1.firebasedatabase.app/" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        function pulisciLink(url) { 
            if (!url) return ""; 
            let trovato = url.match(/https?:\/\/[^"'>\s]+\.(?:jpg|jpeg|gif|png|webp)/i); 
            return trovato ? trovato[0] : url.trim(); 
        }

        function ottieniYoutubeID(url) { 
            if (!url) return null; 
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/; 
            const match = url.match(regExp); 
            return (match && match[2].length == 11) ? match[2] : null; 
        }

        // Lettura griglia con sintassi classica stabile
        database.ref('archivioSergio').on('value', (snapshot) => {
            const lista = document.getElementById('lista-multimedia'); 
            lista.innerHTML = "";
            snapshot.forEach((child) => {
                const data = child.val(); 
                const id = child.key; 
                const linkPulito = pulisciLink(data.immagine || "");
                
                const card = document.createElement('div');
                card.className = 'elemento-album';
                card.onclick = function() { apriContenuto(id); };
                
                card.innerHTML = '<div class="media-box"><img src="' + linkPulito + '" onerror="this.src=\'immagini/scuola.jpg\'"></div>' +
                                 '<div class="info-box"><div class="titolo-post">' + data.titolo + '</div></div>';
                                 
                lista.insertBefore(card, lista.firstChild);
            });
        });

        window.apriContenuto = function(id) {
            database.ref('archivioSergio/' + id).once('value').then((snapshot) => {
                const data = snapshot.val(); 
                if(!data) return;

                document.getElementById('titolo-view').innerText = data.titolo || "";
                document.getElementById('testo-view').innerText = data.testo || "";
                
                const display = document.getElementById('media-display');
                const linkPulito = pulisciLink(data.immagine || "");
                let vId = ottieniYoutubeID(linkPulito);

                if (vId) { 
                    display.innerHTML = '<div style="background:rgba(0,0,0,0.03); padding:40px; border-radius:15px; margin-bottom:25px;">' +
                                        '<a href="https://www.youtube.com/watch?v=' + vId + '" target="_blank" style="display:inline-block; background:#143ca0; color:white; padding:15px 40px; border-radius:50px; text-decoration:none; font-weight:bold; font-size:1.2rem;">GUARDA IL VIDEO 🎥</a>' +
                                        '</div>'; 
                } else { 
                    display.innerHTML = '<img src="' + linkPulito + '" class="img-display-pulita" onerror="this.src=\'immagini/scuola.jpg\'">'; 
                }

                const urlSito = window.location.origin + window.location.pathname + "?id=" + id;
                const msgTutti = encodeURIComponent("✨ Guarda questo ricordo:\n*" + data.titolo + "*\n\nLink:\n" + urlSito);
                const msgMe = encodeURIComponent("Ciao Sergio, riguardo a: " + data.titolo + "\n" + urlSito); 

                // Configurazione indirizzi dei link in puro testo neri
                document.getElementById('link-luoghi').href = "https://api.whatsapp.com/send?text=" + msgTutti;
                document.getElementById('link-consiglio').href = "https://api.whatsapp.com/send?text=" + msgTutti;
                document.getElementById('link-privato').href = "https://wa.me/393398329580?text=" + msgMe;

                document.getElementById('overlay-blu').style.display = 'block'; 
                document.body.style.overflow = 'hidden';
            });
        }

        window.chiudiTutto = function() { 
            document.getElementById('overlay-blu').style.display = 'none'; 
            document.body.style.overflow = 'auto'; 
            
            document.getElementById('link-luoghi').href = "#";
            document.getElementById('link-consiglio').href = "#";
            document.getElementById('link-privato').href = "#";
        }
    </script>
</body>
</html>
