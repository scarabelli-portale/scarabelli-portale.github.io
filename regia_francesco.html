<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GESTIONE PRIMA PAGINA - FRANCESCO</title>
    <style>
        body { font-family: sans-serif; background: #f5f7fa; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eaeaea; }
        .header-regia { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        h1 { margin: 0; color: #111; text-transform: uppercase; font-size: 1.8rem; }
        .btn-esci { padding: 8px 18px; background: #34495e; color: white !important; text-decoration: none !important; border-radius: 6px; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; }
        .btn-esci:hover { background: #2c3e50; }
        .sottotitolo { color: #666; margin-bottom: 30px; font-size: 0.95rem; margin-top: 5px; }
        .status-box { background: #f0f4f8; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 30px; border: 1px solid #d0dbe5; }
        .status-box span { color: #143ca0; }
        
        .btn-reset { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 12px; font-size: 0.9rem; text-transform: uppercase; }
        .btn-reset:hover { background: #c0392b; }

        .sezione-titolo { text-align: center; font-weight: bold; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 0.5px; }
        .lista-post { display: flex; flex-direction: column; gap: 15px; }
        .post-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eaeaea; }
        .post-info { display: flex; flex-direction: column; gap: 3px; }
        .autore { color: #143ca0; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .titolo { font-weight: bold; font-size: 1.1rem; }
        .data { color: #777; font-size: 0.75rem; }
        .post-actions { display: flex; gap: 20px; }
        .action-btn { background: none; border: none; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; cursor: pointer; }
        .btn-home { color: #000000; }
        .btn-home:hover { color: #143ca0; }
        .btn-elimina { color: #000000; }
        .btn-elimina:hover { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-regia">
            <h1>⚓ GESTIONE PRIMA PAGINA</h1>
            <a href="index.html" class="btn-esci">⬅ ESCI</a>
        </div>
        <div class="sottotitolo">Gestione flussi redazionali e Prima Pagina universale</div>

        <div class="status-box">
            ATTUALMENTE IN PRIMA PAGINA: <span id="current-home">CARICAMENTO...</span><br>
            <button class="btn-reset" onclick="rimuoviDaHome()">❌ TOGLIERE IL MANIFESTO/LOCANDINA IN PRIMA PAGINA</button>
        </div>

        <div class="sezione-titolo">ULTIMI POST DA TUTTE LE REDAZIONI</div>
        <div id="lista-post" class="lista-post"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDoVrE-Tx0NL2UqDXAK0Z9EnZdjEVxZLIc",
            databaseURL: "https://sito-sergio-b19ce-default-rtdb.europe-west1.firebasedatabase.app/" 
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        // Strutture di memoria per aggregare i dati
        let tuttiIPost = {};
        const canaliArchivio = [
            { id: 'archivio_francesco', nomeAutore: 'FRANCESCO' },
            { id: 'archivioCinzia', nomeAutore: 'CINZIA' },
            { id: 'archivioFausto', nomeAutore: 'FAUSTO' },
            { id: 'archivioCarlo', nomeAutore: 'CARLO' },
            { id: 'archivioSergio', nomeAutore: 'SERGIO' }
        ];

       // Monitoraggio stato prima pagina con cambio colore intelligente del pulsante
database.ref('regiaFrancesco/primoPiano').on('value', function(snap) {
    const info = snap.val();
    const textEl = document.getElementById('current-home');
    const btnReset = document.querySelector('.btn-reset'); // Prende il pulsante rosso
    
    if(info && info.titolo) {
        textEl.innerText = info.titolo.toUpperCase();
        
        // C'È UN MANIFESTO: Il pulsante diventa Rosso Acceso ed è attivo
        if(btnReset) {
            btnReset.style.background = '#e74c3c';
            btnReset.style.color = 'white';
            btnReset.style.cursor = 'pointer';
            btnReset.style.opacity = '1';
        }
    } else {
        textEl.innerText = "NESSUNO (CONFIGURAZIONE CLASSICA)";
        
        // PAGINA LIBERA: Il pulsante si "spegne" in grigio chiaro
        if(btnReset) {
            btnReset.style.background = '#bdc3c7';
            btnReset.style.color = '#7f8c8d';
            btnReset.style.cursor = 'default';
            btnReset.style.opacity = '0.7';
        }
    }
});

        // 2. Funzione centrale per unire ed ordinare i post di tutti i canali
        function caricaEUnisciArchivi() {
            tuttiIPost = {}; // Reset memoria locale temporanea
            let conteggioCanaliCaricati = 0;

            canaliArchivio.forEach(function(canale) {
                database.ref(canale.id).once('value', function(snap) {
                    const dati = snap.val();
                    if(dati) {
                        Object.keys(dati).forEach(function(keyId) {
                            // Copiamo il post aggiungendo l'informazione di chi lo ha scritto e da dove viene
                            tuttiIPost[keyId] = Object.assign({}, dati[keyId], {
                                idOriginale: keyId,
                                autoreSito: canale.nomeAutore,
                                nodoSorgente: canale.id
                            });
                        });
                    }
                    
                    conteggioCanaliCaricati++;
                    // Quando tutti e 5 i canali hanno risposto, generiamo la lista visibile
                    if(conteggioCanaliCaricati === canaliArchivio.length) {
                        disegnaListaUnificata();
                    }
                });
            });
        }

        // 3. Genera la struttura grafica dei post mischiati dal più recente
        function disegnaListaUnificata() {
            const container = document.getElementById('lista-post');
            container.innerHTML = "";

            // Ordiniamo le chiavi dei post (Firebase genera le chiavi in ordine temporale nativo)
            const chiaviOrdinate = Object.keys(tuttiIPost).sort().reverse();

            chiaviOrdinate.forEach(function(id) {
                const post = tuttiIPost[id];
                const row = document.createElement('div');
                row.className = 'post-row';
                
                row.innerHTML = `
                    <div class="post-info">
                        <span class="autore">${post.autoreSito}</span>
                        <span class="titolo">${post.titolo || 'Senza Titolo'}</span>
                        <span class="data">${post.data || ''}</span>
                    </div>
                    <div class="post-actions">
                        <button class="action-btn btn-home" onclick="mettiInHome('${id}')">VAI IN HOME</button>
                        <button class="action-btn btn-elimina" onclick="eliminaPost('${post.nodoSorgente}', '${id}')">ELIMINA 🗑️</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // 4. Invia alla Home Page il post selezionato (da qualsiasi autore provenga)
        window.mettiInHome = function(id) {
            const postSelezionato = tuttiIPost[id];
            if (postSelezionato) {
                database.ref('regiaFrancesco/primoPiano').set({
                    idPost: id,
                    titolo: postSelezionato.titolo || "",
                    testo: postSelezionato.testo || "",
                    immagine: postSelezionato.immagine || postSelezionato.urlImmagine || postSelezionato.foto || "",
                    data: postSelezionato.data || "",
                    sorgente: postSelezionato.nodoSorgente
                });
            }
        };

        window.rimuoviDaHome = function() {
            database.ref('regiaFrancesco/primoPiano').set(null);
        };

        window.eliminaPost = function(nodoSorgente, id) {
            if(confirm("Vuoi davvero eliminare questo post dall'archivio originale?")) {
                database.ref(nodoSorgente).child(id).remove().then(function() {
                    // Ricarica la lista per mostrare i dati aggiornati
                    caricaEUnisciArchivi();
                });
            }
        };

        // Avvio automatico al caricamento della pagina
        caricaEUnisciArchivi();
        
        // Ascolta in tempo reale se qualcuno aggiunge nuovi post
        canaliArchivio.forEach(function(canale) {
            database.ref(canale.id).on('child_changed', caricaEUnisciArchivi);
            database.ref(canale.id).on('child_added', caricaETransit);
        });
        
        let inizializzato = false;
        function caricaETransit() {
            if(!inizializzato) { inizializzato = true; return; }
            caricaEUnisciArchivi();
        }
    </script>
</body>
</html>
