<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="🚀 ARCHIVIO STORICO - CINZIA">
    <meta property="og:description" content="Vieni a vedere il post ampliato, duraturo e stabile. Molto meglio di WhatsApp!">
    <meta property="og:image" content="https://scarabelli-portale.github.io/immagini/scuola.jpg">
    <meta property="og:type" content="website">
    <title>Archivio - Cinzia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght=700&display=swap');
        
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0;
            background-color: #ffffff; /* Fondale bianco pagina principale */
            color: #000000; /* Testo generale nero */
            text-align: center;
            line-height: 1.6;
        }
        
        /* TESTATA ORIGINALE DI CINZIA */
        .header-fissa { position: fixed; top: 0; width: 100%; height: 250px; z-index: 1000; background: #000; border-bottom: 5px solid #27ae60; overflow: hidden; }
        .foto-header { width: 100%; height: 100%; object-fit: cover; object-position: center 40%; opacity: 0.7; }
        #contenitore-titolo { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; width: 100%; }
        .titolo-stampato { font-size: 0.9rem; letter-spacing: 6px; text-transform: uppercase; color: white; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .firma-persona { font-family: 'Dancing Script', cursive; font-size: 3.5rem; color: #27ae60; text-shadow: 3px 3px 8px rgba(0,0,0,1); margin-top: -10px; }
        
        .btn-nav { position: absolute; top: 15px; padding: 10px 18px; border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 0.7rem; z-index: 1001; display: flex; align-items: center; gap: 5px; }
        .btn-home { left: 15px; background: rgba(255,255,255,0.2); color: white; border: 1px solid white; }
        
        .content-wrapper { margin-top: 270px; padding: 20px; text-align: center; }
        .griglia-articoli { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; max-width: 1200px; margin: auto; }
        
        /* SCHEDINE DEI POST MODERNE E PULITE */
        .card-didattica { 
            background: #ffffff; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); 
            cursor: pointer; 
            text-align: left; 
            display: flex; 
            flex-direction: column;
            border: 1px solid #eaeaea;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-didattica:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .card-didattica img { width: 100%; height: 180px; object-fit: cover; }
        .card-info { padding: 16px; }
        .card-titolo { font-weight: bold; color: #1e8449; font-size: 1.05rem; }
        
        /* OVERLAY PROFESSIONALE: TUTTO BIANCO */
        #overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #ffffff; /* Fondale bianco anche all'apertura del post */
            z-index: 2000; 
            overflow-y: auto; 
            box-sizing: border-box;
            padding: 40px 20px;
        }
        
        .content-view { 
            max-width: 800px; 
            margin: auto; 
            text-align: center; 
        }
        
        /* IMMAGINE PULITA NELL'OVERLAY */
        .img-view { 
            width: auto; 
            max-width: 100%; 
            height: auto; 
            max-height: 450px; 
            object-fit: contain; 
            border-radius: 8px; 
            margin: 20px auto; 
            display: block;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        /* TESTO DELL'ARTICOLO NERO SU BIANCO */
        .testo-scritto {
            text-align: justify; 
            white-space: pre-wrap; 
            font-size: 1.15rem; 
            padding: 10px; 
            color: #000000; /* Testo nero nitido */
            max-width: 750px;
            margin: 25px auto;
        }

        /* AREA PULSANTI TESTUALI IN LINEA IN NERETTO */
        .area-pulsanti-sergio {
            margin-top: 50px;
            padding-bottom: 20px;
            text-align: center;
            border-top: 1px solid #eaeaea;
            padding-top: 30px;
        }
        .area-pulsanti-sergio a {
            color: #000000; /* Link neri nel piede della pagina */
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            margin: 10px 20px;
            display: inline-block;
            font-size: 16px;
            letter-spacing: 0.8px;
            font-family: sans-serif;
            transition: color 0.2s;
        }
        .area-pulsanti-sergio a:hover {
            color: #27ae60; /* Evidenziato verde quando ci passi sopra */
        }
    </style>
</head>
<body>

    <!-- TESTATA ORIGINALE DI CINZIA -->
    <div class="header-fissa">
        <a href="index.html" class="btn-nav btn-home">⬅ HOME</a>
        <img src="immagini/scuola.jpg" class="foto-header">
        <div id="contenitore-titolo">
            <div class="titolo-stampato">Scuola & Lavoro</div>
            <div class="firma-persona">Cinzia</div>
        </div>
    </div>

    <!-- GRIGLIA ARTICOLI SU FONDO BIANCO -->
    <div class="content-wrapper">
        <div class="griglia-articoli" id="container-articoli-cinzia"></div>
    </div>

    <!-- OVERLAY COMPLETAMENTE BIANCO CON TESTI NERI -->
    <div id="overlay">
        <div class="content-view">
            
            <!-- TITOLO DEL POST APERTO IN NERO (O VERDE COORDINATO) -->
            <h2 id="titolo-view" style="color: #1e8449; font-family: sans-serif; font-size: 2.4rem; font-weight: bold; text-transform: uppercase; margin-bottom: 25px;"></h2>
            
            <!-- IMMAGINE PULITA -->
            <img id="img-view" src="" style="display:none;" class="img-view">
            
            <!-- TESTO NERO NITIDO -->
            <div id="testo-view" class="testo-scritto"></div>
            
            <!-- I QUATTRO PULSANTI TESTUALI IN LINEA NERI -->
            <div class="area-pulsanti-sergio">
                <a id="link-consiglio" href="#" target="_blank">WZ CONSIGLIO SCARABELLI</a>
                <a id="link-tutti" href="#" target="_blank">WZ TUTTI GLI EX ALLIEVI</a>
                <a id="link-privato" href="#" target="_blank">WZ ARCHIVIO PERSONALE</a>
                <a href="javascript:chiudiOverlay();">CHIUDI X</a>
            </div>
            
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = { databaseURL: "https://sito-sergio-b19ce-default-rtdb.europe-west1.firebasedatabase.app/" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();
        function pulisciLink(url) { if (!url) return ""; let trovato = url.match(/https?:\/\/[^"'>\s]+\.(?:jpg|jpeg|gif|png|webp)/i); return trovato ? trovato[0] : url.trim(); }
        
        // Gestione apertura automatica da link esterno (?id=...)
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        if (postId) { setTimeout(() => { apri(postId); }, 1000); }

        window.apri = function(id) {
            db.ref('archivioCinzia/' + id).once('value').then((snap) => {
                const art = snap.val(); if(!art) return;
                const imgV = document.getElementById('img-view');
                if(art.immagine) { imgV.src = pulisciLink(art.immagine); imgV.style.display = 'block'; } else { imgV.style.display = 'none'; }
                document.getElementById('titolo-view').innerText = art.titolo;
                document.getElementById('testo-view').innerText = art.testo;
                
                const urlSito = "https://scarabelli-portale.github.io/cinzia.html?id=" + id;
                const msgTutti = encodeURIComponent(
                    "🚀 *VIENI A VEDERE SUL SITO IL POST AMPLIATO, DURATURO E STABILE.*\n\n" +
                    "📢 *Cosa che purtroppo non succede su WhatsApp dove tutto scorre via.*\n\n" +
                    "📖 Titolo: *" + art.titolo + "*\n" +
                    "🔗 Apri l'archivio qui: " + urlSito
                );
                const msgMe = encodeURIComponent(
                    "📌 ARCHIVIO PERSONALE:\n" +
                    "Post: " + art.titolo + "\n" +
                    "Link: " + urlSito
                );

                // Aggancia i messaggi ai link testuali neri
                document.getElementById('link-consiglio').href = "https://api.whatsapp.com/send?text=" + msgTutti;
                document.getElementById('link-tutti').href = "https://api.whatsapp.com/send?text=" + msgTutti;
                document.getElementById('link-privato').href = "https://wa.me/393398329580?text=" + msgMe;

                document.getElementById('overlay').style.display = 'block'; document.body.style.overflow = 'hidden';
            });
        }
        
        window.chiudiOverlay = function() { 
            document.getElementById('overlay').style.display = 'none'; 
            document.body.style.overflow = 'auto'; 
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // Caricamento griglia principale con sintassi classica sicura
        db.ref('archivioCinzia').on('value', (snapshot) => {
            const container = document.getElementById('container-articoli-cinzia'); container.innerHTML = "";
            const data = snapshot.val();
            if (data) {
                Object.keys(data).reverse().forEach(id => {
                    const art = data[id]; const imgPulita = art.immagine ? pulisciLink(art.immagine) : 'https://via.placeholder.com/400x250?text=Didattica';
                    
                    const card = document.createElement('div');
                    card.className = 'card-didattica';
                    card.onclick = function() { apri(id); };
                    
                    card.innerHTML = '<img src="' + imgPulita + '">' +
                                     '<div class="card-info">' +
                                         '<div class="card-titolo">' + art.titolo + '</div>' +
                                     '</div>';
                                     
                    container.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
