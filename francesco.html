<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archivio Francesco - SCARABELLIAMENTE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* IMPORTAZIONE FONT ELEGANTE PARISIENNE */
        @import url('https://fonts.googleapis.com/css2?family=Parisienne&display=swap');
        
        body { 
            font-family: sans-serif; 
            background-color: #ffffff; 
            color: #000000; 
            margin: 0; 
            padding: 0; 
            line-height: 1.6;
        }
        
        .copertina-container { 
            position: relative; 
            width: 100%; 
            max-width: 1300px; 
            margin: 0 auto; 
            height: 250px; 
            overflow: hidden; 
            border-bottom: 5px solid #143ca0; 
            background: #000; 
        }
        .foto-scuola { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            object-position: center 40%;
            opacity: 0.7; 
        }
        
        #contenitore-titolo { 
            position: absolute; 
            bottom: 5px; 
            left: 50%; 
            transform: translateX(-50%); 
            text-align: center; 
            z-index: 10; 
            width: 100%; 
        }
        
        .titolo-stampato { 
            font-family: 'Parisienne', cursive;
            font-size: 3.8rem; 
            color: white; 
            text-shadow: 3px 3px 8px rgba(0,0,0,1);
            font-weight: normal; 
            margin-bottom: -15px;
            display: block;
        }
        
        .firma-francesco { 
            font-family: 'Parisienne', cursive; 
            font-size: 2.2rem; 
            color: #ffffff; 
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9); 
            margin-top: 0;
            display: block;
        }

        .btn-nav { 
            position: absolute; 
            top: 15px; 
            padding: 10px 18px; 
            border-radius: 30px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 0.7rem; 
            z-index: 1001; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
        }
        .btn-home { 
            left: 15px; 
            background: rgba(255,255,255,0.2); 
            color: white; 
            border: 1px solid white;
        }
        
        .main-wrapper { max-width: 1200px; margin: 30px auto; padding: 0 15px; }
        
        .container-griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        
        .card { 
            background: #ffffff; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); 
            border: 1px solid #eaeaea;
            transition: transform 0.2s, box-shadow 0.2s; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
        }
        .card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .card-media-box {
            width: 100%;
            height: 180px;
            background: #f9f9f9; 
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-media-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }
        
        .card-content { padding: 16px; flex-grow: 1; text-align: center; }
        .card-content h3 { margin: 0 0 8px; color: #143ca0; font-size: 1.05rem; font-weight: bold; text-transform: uppercase; }
        .card-content p { color: #444444; font-size: 0.95rem; margin: 0; height: 45px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; text-align: justify; }

        .modal { 
            display: none; 
            position: fixed; 
            z-index: 9999; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background-color: #ffffff; 
            overflow-y: auto; 
            box-sizing: border-box;
            padding: 40px 20px;
        }
        .modal-content { max-width: 800px; margin: auto; text-align: center; }
        
        .modal-media img { 
            width: auto; 
            max-width: 100%; 
            height: auto; 
            max-height: 70vh !important; 
            object-fit: contain; 
            margin: 20px auto; 
            display: block;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            background: #ffffff;
        }
        
        /* CORREZIONE STRUTTURALE DEL LETTORE VIDEO DENTRO IL POPUP */
        .modal-media iframe { 
            width: 100%; 
            max-width: 650px;
            height: 360px; 
            border-radius: 12px; 
            margin: 20px auto; 
            display: block; 
            border: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .modal-text { 
            text-align: justify; 
            line-height: 1.7; 
            color: #000000; 
            white-space: pre-wrap; 
            font-size: 1.15rem; 
            max-width: 750px;
            margin: 25px auto;
            padding: 10px;
        }

        .piede-pulsantiera-francesco {
            margin-top: 50px;
            text-align: center;
            border-top: 1px solid #eaeaea;
            padding-top: 30px;
            width: 100%;
        }
        .puro-testo-btn {
            background: none !important;
            border: none !important;
            margin: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none !important; 
            color: #000000 !important; 
            cursor: pointer;
            display: inline-block;
            font-family: sans-serif;
            letter-spacing: 0.8px;
            transition: color 0.2s ease;
        }
        
        /* ICONA MODALITÀ VERDE SCURO E COMPATTA PER PC */
        .puro-testo-btn i {
            color: #0f8b3c !important; 
            font-size: 16px;
            margin-right: 5px;
            vertical-align: middle;
        }
        .puro-testo-btn:hover { color: #143ca0 !important; }

        /* PULSANTIERA ULTRA-COMPATTA CON ICONE GIGANTI PER CELLULARI */
        @media screen and (max-width: 600px) {
            #modal-titolo { 
                font-size: 1.15rem !important; 
                margin-bottom: 15px !important;
                line-height: 1.4 !important;
            }
            .titolo-stampato { font-size: 2.2rem !important; }
            .firma-francesco { font-size: 1.3rem !important; }
            .copertina-container { height: 160px !important; }
            .modal-media iframe { height: 210px; } 
            
            .piede-pulsantiera-francesco { 
                display: flex !important; 
                flex-direction: row !important; 
                flex-wrap: nowrap !important; 
                justify-content: space-between !important; 
                gap: 4px !important; 
                margin-top: 25px !important; 
                padding-top: 15px !important; 
            }
            .puro-testo-btn { 
                margin: 0 !important; 
                font-size: 11px !important; 
                font-weight: 800 !important; 
                white-space: nowrap !important; 
                flex: 1; 
                text-align: center; 
                display: flex !important; 
                align-items: center; 
                justify-content: center; 
            }
            
            /* ICONE GIGANTI AD ALTO CONTRASTO SUL TELEFONO */
            .puro-testo-btn i { 
                font-size: 18px !important; 
                margin-right: 4px !important; 
            }
        }
    </style>
</head>
<body>

    <div class="copertina-container">
        <a href="index.html" class="btn-nav btn-home">⬅ HOME</a>
        <img src="immagini/scuola.jpg" class="foto-scuola">
        <div id="contenitore-titolo">
            <span class="titolo-stampato">Scarabelliamente</span>
            <span class="firma-francesco">Archivio Francesco</span>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="container-griglia" id="archivio-grid"></div>
    </div>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <h2 id="modal-titolo" style="text-align:center; color:#143ca0; font-family: sans-serif; font-weight: bold; text-transform: uppercase; font-size: 2rem; margin-bottom: 25px;"></h2>
            <div id="modal-media" class="modal-media"></div>
            <div id="modal-text" class="modal-text"></div>
            <div class="piede-pulsantiera-francesco">
                <a id="link-consiglio" href="#" target="_blank" class="puro-testo-btn"><i class="fab fa-whatsapp"></i>CONSIGLIO</a>
                <a id="link-tutti" href="#" target="_blank" class="puro-testo-btn"><i class="fab fa-whatsapp"></i>EX ALLIEVI</a>
                <a id="link-privato" href="#" target="_blank" class="puro-testo-btn"><i class="fab fa-whatsapp"></i>PERSONALE</a>
                <button class="puro-testo-btn" onclick="chiudiModal()">CHIUDI X</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDoVrE-Tx0NL2UqDXAK0Z9EnZdjEVxZLIc",
            databaseURL: "https://sito-sergio-b19ce-default-rtdb.europe-west1.firebasedatabase.app/" 
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        function estraiIdYouTube(url) {
            if (!url) return null;
            var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            var match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function ottieniAnteprimaMedia(postData) {
            let stringaMedia = (postData.urlImmagine || postData.immagine || postData.foto || "").trim();
            if (stringaMedia.includes('<img')) {
                const match = stringaMedia.match(/src="([^"]+)"/);
                if (match) stringaMedia = match[1];
            }
            stringaMedia = stringaMedia.trim();

            if (stringaMedia.includes('youtube.com') || stringaMedia.includes('youtu.be')) {
                const vId = estraiIdYouTube(stringaMedia);
                if (vId) {
                    return 'https://img.youtube.com/vi/' + vId + '/hqdefault.jpg';
                }
            }
            return stringaMedia || 'immagini/francesco.jpg';
        }

        function caricaArchivio() {
            database.ref('archivio_francesco').on('value', function(snap) {
                const grid = document.getElementById('archivio-grid');
                grid.innerHTML = "";
                const dati = snap.val();
                
                if (dati) {
                    Object.keys(dati).reverse().forEach(function(id) {
                        const post = dati[id];
                        const miniaturaCorretta = ottieniAnteprimaMedia(post);
                        
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = function() { apriModal(id); };
                        
                        card.innerHTML = '<div class="card-media-box"><img src="' + miniaturaCorretta + '" onerror="this.src=\'immagini/francesco.jpg\'"></div>' +
                                         '<div class="card-content">' +
                                             '<h3>' + (post.titolo || 'Senza Titolo') + '</h3>' +
                                             '<p>' + (post.testo || "") + '</p>' +
                                         '</div>';
                        grid.appendChild(card);
                    });
                }
            });
        }

        window.apriModal = function(id) {
            database.ref('archivio_francesco/' + id).once('value').then(function(snapshot) {
                const post = snapshot.val();
                if(!post) return;

                const mMedia = document.getElementById("modal-media");
                document.getElementById("modal-titolo").innerText = post.titolo || "Senza Titolo";
                document.getElementById("modal-text").innerText = post.testo || "";

                let media = (post.urlImmagine || post.immagine || post.foto || "").trim();
                if (media.includes('<img')) {
                    const match = media.match(/src="([^"]+)"/);
                    if (match) media = match[1];
                }
                media = media.trim();

                if (media.includes('youtube.com') || media.includes('youtu.be')) {
                    const vId = estraiIdYouTube(media);
                    mMedia.innerHTML = '<iframe src="https://www.youtube.com/embed/' + vId + '" frameborder="0" allowfullscreen></iframe>';
                } 
                else if (media.length > 10) {
                    mMedia.innerHTML = '<img src="' + media + '" onerror="this.style.display=\'none\'">';
                } else {
                    mMedia.innerHTML = '';
                }
                
                const urlSito = "https://scarabelli-portale.github.io/francesco.html?id=" + id;
                
                // LOGICA SALVA-VECCHIETTI ATTIVATA: MESSAGGIO PULITO IN ITALIANO
                const messaggioPulito = encodeURIComponent("Guarda questo contenuto su Scarabelliamente:\n\n" + (post.titolo || "") + "\n\nClicca qui per vederlo sul sito:\n" + urlSito);

                document.getElementById('link-consiglio').href = "https://api.whatsapp.com/send?text=" + messaggioPulito;
                document.getElementById('link-tutti').href = "https://api.whatsapp.com/send?text=" + messaggioPulito;
                document.getElementById('link-privato').href = "https://wa.me/393398329580?text=" + messaggioPulito;

                document.getElementById("myModal").style.display = "block";
                document.body.style.overflow = 'hidden';
            });
        }

        window.chiudiModal = function() {
            document.getElementById("myModal").style.display = "none";
            document.getElementById("modal-media").innerHTML = "";
            document.body.style.overflow = 'auto';
        }

        caricaArchivio();
    </script>
</body>
</html>
